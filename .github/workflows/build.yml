name: Build HyperTopia Installer App

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Clean npm cache
        run: npm cache clean --force
        continue-on-error: true

      - name: Install deps
        run: npm ci

      - name: Build (electron-vite)
        run: npm run build
        env:
          REACT_APP_GOOGLE_API_KEY: ${{ secrets.REACT_APP_GOOGLE_API_KEY }}
          REACT_APP_GOOGLE_CLIENT_ID: ${{ secrets.REACT_APP_GOOGLE_CLIENT_ID }}

      - name: Build installers (Windows)
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REACT_APP_GOOGLE_API_KEY: ${{ secrets.REACT_APP_GOOGLE_API_KEY }}
          REACT_APP_GOOGLE_CLIENT_ID: ${{ secrets.REACT_APP_GOOGLE_CLIENT_ID }}
        run: npx electron-builder --publish never --win

      - name: Build installers (Mac)
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REACT_APP_GOOGLE_API_KEY: ${{ secrets.REACT_APP_GOOGLE_API_KEY }}
          REACT_APP_GOOGLE_CLIENT_ID: ${{ secrets.REACT_APP_GOOGLE_CLIENT_ID }}
        run: npx electron-builder --publish never --mac --x64 --arm64

      - name: Upload artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap

      - name: Upload artifacts (Mac)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: build-mac
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            dist/*.blockmap

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Previous Tag
        id: previoustag
        run: |
          CURRENT_TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${CURRENT_TAG}$" | head -1)
          echo "Previous tag: $PREV_TAG"
          echo "Current tag: $CURRENT_TAG"
          echo "tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List commits between tags
        run: |
          echo "Commits between ${{ steps.previoustag.outputs.tag }} and ${{ github.ref_name }}:"
          git log --oneline ${{ steps.previoustag.outputs.tag }}..${{ github.ref_name }} || echo "No previous tag found, showing recent commits:"
          git log --oneline -10

      - name: Setup Node for changelog
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Changelog
        id: changelog
        run: |
          PREV_TAG="${{ steps.previoustag.outputs.tag }}"
          CURR_TAG="${{ github.ref_name }}"
          echo "Generating changelog from $PREV_TAG to $CURR_TAG"

          CHANGELOG=$(node scripts/generate-changelog.js "$PREV_TAG" "$CURR_TAG")

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "=== Changelog Preview ==="
          echo "$CHANGELOG"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          tag_name: ${{ github.ref_name }}
          files: artifacts/*
          repository: rigelra15/hypertopia-installer-releases
          token: ${{ secrets.GH_PAT }}

      - name: Prepare Google Drive Credentials
        id: gdrive_creds
        run: |
          cat << 'EOF' > creds.json
          ${{ secrets.GDRIVE_CREDENTIALS }}
          EOF
          ENCODED=$(base64 -w 0 creds.json)
          echo "::add-mask::$ENCODED"
          echo "encoded=$ENCODED" >> $GITHUB_OUTPUT

      - name: Upload to Google Drive
        uses: adityak74/google-drive-upload-git-action@main
        with:
          credentials: ${{ steps.gdrive_creds.outputs.encoded }}
          filename: "artifacts/"
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          name: ${{ github.ref_name }} # Creates a folder with the tag name
          overwrite: "true"
