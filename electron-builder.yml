appId: com.hypertopia.installer
productName: HyperTopia Installer
copyright: Copyright © 2024 HyperTopia
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!.venv_fix/*'
asarUnpack:
  - resources/**
  - node_modules/7zip-bin/**
win:
  executableName: hypertopia-installer
  icon: build/icon.ico
  target:
    - nsis
    - portable
  extraResources:
    - from: resources/unrar.exe
      to: unrar.exe
      filter:
        - '**/*'
    - from: resources/platform-tools
      to: platform-tools
      filter:
        - '**/*'
nsis:
  oneClick: true
  allowToChangeInstallationDirectory: false
  perMachine: false
  differentialPackage: true
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
portable:
  artifactName: ${name}-${version}-portable.${ext}
mac:
  artifactName: "HyperTopia Installer-${version}-mac-${arch}.${ext}"
  icon: resources/icon.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  extraResources:
    - from: resources/platform-tools-darwin
      to: platform-tools-darwin
      filter:
        - '**/*'
    - from: resources/unrar-darwin
      to: unrar-darwin
      filter:
        - '**/*'
dmg:
  title: "HyperTopia Installer"
  iconSize: 128
  window:
    width: 640
    height: 400
  contents:
    - x: 170
      y: 200
    - x: 470
      y: 200
      type: link
      path: /Applications
npmRebuild: false
publish:
  provider: github
